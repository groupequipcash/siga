<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f6">
  <meta name="robots" content="noindex, nofollow">
  <title>Tudo certo</title>
  <style>
    :root {
      --bg: #fff5f6;
      --card: #ffffff;
      --line: rgba(15, 35, 55, 0.08);
      --text: #1c2733;
      --muted: #6b7c8d;
      --blue: #2aabee;
      --blue-deep: #1b93d1;
      --blue-glow: rgba(42, 171, 238, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(560px 340px at 50% 8%, rgba(230, 0, 35, 0.16), transparent 68%),
        radial-gradient(440px 300px at 88% 94%, rgba(230, 0, 35, 0.12), transparent 70%),
        radial-gradient(320px 220px at 8% 80%, rgba(255, 120, 140, 0.2), transparent 70%),
        linear-gradient(180deg, #ffffff 0%, #fff5f6 42%, #ffe8eb 100%);
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      background: rgba(230, 0, 35, 0.14);
      animation: float 7s ease-in-out infinite;
    }

    .orb-a { width: 90px; height: 90px; top: 12%; left: 8%; }
    .orb-b { width: 54px; height: 54px; top: 70%; right: 10%; animation-delay: -2s; }
    .orb-c { width: 28px; height: 28px; top: 38%; right: 18%; animation-delay: -4s; background: rgba(230, 0, 35, 0.28); }

    .card {
      position: relative;
      z-index: 1;
      width: min(420px, 100%);
      padding: 36px 26px 28px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(28, 55, 84, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      text-align: center;
      animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      border-radius: 26px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 14px 30px rgba(230, 0, 35, 0.18);
      animation: pop 0.8s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both, bob 3.4s 1s ease-in-out infinite;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: -0.04em;
      font-weight: 750;
      animation: fade 0.6s 0.25s both;
    }

    .sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 16.5px;
      line-height: 1.45;
      animation: fade 0.6s 0.35s both;
    }

    .cta {
      margin-top: 28px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 16px 22px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      background: linear-gradient(180deg, #3cb4f2 0%, var(--blue-deep) 100%);
      box-shadow: 0 10px 24px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,0.35);
      animation: fade 0.6s 0.45s both, pulse 2.4s 1s ease-in-out infinite;
      overflow: hidden;
      transition: filter 0.18s ease;
    }

    .cta::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.35) 48%, transparent 62%);
      transform: translateX(-120%);
      animation: shine 2.8s 1s ease-in-out infinite;
    }

    .cta:hover {
      filter: brightness(1.05);
    }

    .cta:active {
      transform: translateY(1px) scale(0.985);
    }

    .cta svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      position: relative;
      z-index: 1;
    }

    .cta span {
      position: relative;
      z-index: 1;
    }

    .hint {
      margin-top: 14px;
      color: #8a9aab;
      font-size: 13px;
      animation: fade 0.6s 0.55s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: none; }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 24px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,0.35);
      }
      50% {
        transform: scale(1.035);
        box-shadow: 0 14px 32px rgba(42, 171, 238, 0.55), inset 0 1px 0 rgba(255,255,255,0.35);
      }
    }

    @keyframes shine {
      0%, 55% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <main class="card">
    <div class="logo">
      <img src="https://cdn.pixabay.com/photo/2022/01/11/15/02/pinterest-6930796_1280.png" alt="Pinterest">
    </div>
    <h1>Tudo certo!</h1>
    <p class="sub">Toque no botão abaixo para continuar.</p>
    <button class="cta" id="cta" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 2.8 11.6c-1.3.5-1.3 1.2-.2 1.5l4.9 1.5 1.9 5.8c.2.7.1.9.8.9.5 0 .7-.2 1-.5l2.7-2.6 5.6 4.1c1 .6 1.8.3 2-1l3.6-16.2c.3-1.4-.5-2-1.6-1.6z"/></svg>
      <span>Continuar</span>
    </button>
    <p class="hint">Abre na hora. É só um toque.</p>
  </main>

  <script>
    (function () {
      var packed = "aHR0cHM6Ly92b3JrZXIuc2hvcC9yL29wZXJhLWRvaXM/dXRtX3NvdXJjZT1mYWNlYm9vayZ1dG1fbWVkaXVtPXBhaWQmdXRtX2NhbXBhaWduPW9wZXJhLWRvaXMmZmJjbGlkPXt7ZmJjbGlkfX0=";

      function buildLink() {
        var link = atob(packed);
        try {
          var page = new URLSearchParams(window.location.search);
          var fb = page.get("fbclid");
          var tt = page.get("ttclid");
          if (fb) link = link.replace(/\{\{fbclid\}\}/g, encodeURIComponent(fb));
          if (tt) link = link.replace(/\{\{CLICK_ID\}\}/g, encodeURIComponent(tt));
          ["utm_source", "utm_medium", "utm_campaign", "utm_content", "ttp"].forEach(function (k) {
            var v = page.get(k);
            if (!v) return;
            var re = new RegExp("([?&])" + k + "=[^&]*");
            var pair = k + "=" + encodeURIComponent(v);
            if (re.test(link)) link = link.replace(re, "$1" + pair);
            else link += (link.indexOf("?") >= 0 ? "&" : "?") + pair;
          });
        } catch (e) {}
        return link;
      }

      document.getElementById("cta").addEventListener("click", function (event) {
        if (!event.isTrusted) return;
        window.location.replace(buildLink());
      });
    })();
  </script>
</body>
</html>
